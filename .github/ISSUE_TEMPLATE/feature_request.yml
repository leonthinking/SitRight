name: 功能建议
description: 描述你遇到的问题，以及希望 SitRight 如何帮助你更自然地活动。
title: "[功能建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助 SitRight 变得更好。请先描述真实使用场景和问题，再提出你期望的方案。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么情况下遇到了什么问题？它怎样影响了活动或提醒体验？
      placeholder: 例如：临时会议结束后，原提醒节奏与我的活动状态不一致……
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 你希望 SitRight 最终帮助你达成什么结果？
      placeholder: 描述结果即可，不必局限于某个按钮或设置项。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 尝试过的办法
      description: 如果有，请说明你目前如何处理，以及它为什么不够好。

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可以添加界面截图或相关说明，请先移除个人与敏感信息。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交密码、令牌、私钥、个人文件路径或其他敏感信息。
          required: true
